name: stockteam

on:
  schedule:
    - cron: "0 4 * * 1-5"        # Morgenbericht, ca. 6:00 Uhr deutscher Zeit
    - cron: "*/30 7-20 * * 1-5"  # Alarm-Check während der Börsenzeiten
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockteam
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Team ausführen
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "*/30 7-20 * * 1-5" ]; then MODE=alerts; else MODE=report; fi
          python main.py $MODE
      - name: Depotstand speichern
        run: |
          git config user.name "stockteam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ report.json || true
          git diff --cached --quiet || (git commit -m "Depot & Report aktualisiert" && git push)
