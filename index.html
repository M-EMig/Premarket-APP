<title>The-TEAM- Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap">

<style>
  /* Layout: fixed sidebar nav, scrollable main content */
  :root {
    --bg: #0d0f14;
    --bg2: #151820;
    --bg3: #1c2030;
    --border: #252a38;
    --fg: #e2e6f0;
    --fg2: #8b93a8;
    --fg3: #555e73;
    --accent: #4f8ef7;
    --buy: #34c77b;
    --sell: #f05252;
    --hold: #f5a623;
    --mono: "IBM Plex Mono", monospace;
    --sans: "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f6fb;
      --bg2: #ffffff;
      --bg3: #eaedf5;
      --border: #d4d9e8;
      --fg: #111827;
      --fg2: #4b5563;
      --fg3: #9ca3af;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f6fb;
    --bg2: #ffffff;
    --bg3: #eaedf5;
    --border: #d4d9e8;
    --fg: #111827;
    --fg2: #4b5563;
    --fg3: #9ca3af;
    color-scheme: light;
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; }

  .app {
    display: grid;
    grid-template-columns: 200px 1fr;
    grid-template-rows: 48px 1fr;
    height: 100%;
  }

  /* Top bar */
  .topbar {
    grid-column: 1 / -1;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  }
  .topbar-logo {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 15px;
    color: var(--accent);
    letter-spacing: -.5px;
  }
  .topbar-sub { color: var(--fg3); font-size: 12px; }
  .topbar-time { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--fg3); }
  .theme-toggle {
    background: none; border: 1px solid var(--border); color: var(--fg2);
    border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 12px;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

  /* Sidebar */
  .sidebar {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
  }
  .nav-label { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg3); padding: 12px 8px 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px; border-radius: 6px; cursor: pointer;
    color: var(--fg2); font-size: 13px; font-weight: 500;
    border: none; background: none; width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--bg3); color: var(--fg); }
  .nav-item.active { background: var(--accent)18; color: var(--accent); }
  .nav-icon { font-size: 15px; width: 18px; text-align: center; }

  /* Main content */
  .main {
    overflow-y: auto;
    padding: 24px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
  }

  /* Sections */
  .section { display: none; }
  .section.active { display: block; }

  .section-title {
    font-size: 18px; font-weight: 600; margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }

  /* Stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .tile {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px;
  }
  .tile-label { font-size: 11px; color: var(--fg3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .tile-value { font-family: var(--mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile-delta { font-size: 12px; margin-top: 4px; }
  .pos { color: var(--buy); }
  .neg { color: var(--sell); }
  .neu { color: var(--fg2); }

  /* Analysis table */
  .table-wrap { overflow-x: auto; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th {
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--fg3); padding: 10px 14px; text-align: left;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  td {
    padding: 11px 14px; border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg3); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .04em;
  }
  .badge-BUY { background: var(--buy)22; color: var(--buy); }
  .badge-SELL { background: var(--sell)22; color: var(--sell); }
  .badge-HOLD { background: var(--hold)22; color: var(--hold); }
  .trend-up { color: var(--buy); font-size: 12px; }
  .trend-down { color: var(--sell); font-size: 12px; }

  /* Alerts */
  .alerts-list { display: flex; flex-direction: column; gap: 8px; }
  .alert-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 16px;
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 12px;
  }
  .alert-card.sell { border-left: 3px solid var(--sell); }
  .alert-card.buy { border-left: 3px solid var(--buy); }
  .alert-card.info { border-left: 3px solid var(--fg3); }
  .alert-type { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  .alert-msg { font-size: 13px; color: var(--fg2); }
  .alert-ticker { font-family: var(--mono); font-size: 13px; font-weight: 600; }

  /* News */
  .news-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border-radius: 10px; overflow: hidden; }
  .news-item {
    background: var(--bg2); padding: 11px 16px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .news-item:hover { background: var(--bg3); }
  .news-source {
    font-family: var(--mono); font-size: 10px; color: var(--accent);
    white-space: nowrap; min-width: 80px;
  }
  .news-title { font-size: 13px; color: var(--fg); line-height: 1.4; }

  /* Depot positions */
  .positions-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .pos-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px;
  }
  .pos-ticker { font-family: var(--mono); font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .pos-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg2); margin-top: 4px; }
  .pos-pnl { font-family: var(--mono); font-size: 14px; font-weight: 600; }

  /* Empty / loading states */
  .empty { color: var(--fg3); font-size: 13px; padding: 32px; text-align: center; }
  .loading { color: var(--fg3); font-size: 13px; padding: 48px; text-align: center; font-family: var(--mono); }

  /* Responsive */
  @media (max-width: 600px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 48px auto 1fr; }
    .sidebar {
      flex-direction: row; gap: 0; padding: 0;
      padding-inline: max(8px, env(safe-area-inset-left, 0px)) max(8px, env(safe-area-inset-right, 0px));
      overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border);
    }
    .nav-label { display: none; }
    .nav-item { flex-direction: column; gap: 3px; font-size: 10px; padding: 8px 10px; border-radius: 0; }
    .nav-icon { font-size: 18px; }
  }
</style>

<div class="app">
  <header class="topbar">
    <span class="topbar-logo">THE-TEAM-</span>
    <span class="topbar-sub">Börsen-Dashboard</span>
    <span class="topbar-time" id="gen-time">–</span>
    <button class="theme-toggle" onclick="toggleTheme()">◑</button>
  </header>

  <nav class="sidebar">
    <div class="nav-label">Übersicht</div>
    <button class="nav-item active" onclick="show('analyse')" id="nav-analyse">
      <span class="nav-icon">📊</span> Analyse
    </button>
    <button class="nav-item" onclick="show('alarme')" id="nav-alarme">
      <span class="nav-icon">🔔</span> Alarme
    </button>
    <button class="nav-item" onclick="show('depot')" id="nav-depot">
      <span class="nav-icon">💼</span> Depot
    </button>
    <div class="nav-label">Info</div>
    <button class="nav-item" onclick="show('news')" id="nav-news">
      <span class="nav-icon">📰</span> News
    </button>
  </nav>

  <main class="main">
    <div id="loading" class="loading">Lade report.json…</div>

    <!-- Analyse -->
    <div class="section" id="section-analyse">
      <div class="section-title">📊 Marktanalyse</div>
      <div class="tiles" id="tiles"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Ticker</th>
              <th>Kurs</th>
              <th>RSI</th>
              <th>vs 20T-Hoch</th>
              <th>Trend</th>
              <th>Signal</th>
              <th>Begründung</th>
            </tr>
          </thead>
          <tbody id="analyse-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Alarme -->
    <div class="section" id="section-alarme">
      <div class="section-title">🔔 Alarme</div>
      <div class="alerts-list" id="alerts-list"></div>
    </div>

    <!-- Depot -->
    <div class="section" id="section-depot">
      <div class="section-title">💼 Depot (Simulation)</div>
      <div class="tiles" id="depot-tiles"></div>
      <div class="positions-list" id="positions-list"></div>
    </div>

    <!-- News -->
    <div class="section" id="section-news">
      <div class="section-title">📰 Aktuelle News</div>
      <div class="news-list" id="news-list"></div>
    </div>
  </main>
</div>

<script>
  // Theme
  function toggleTheme() {
    const r = document.documentElement;
    const cur = r.getAttribute('data-theme');
    r.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    try { localStorage.setItem('theme', r.getAttribute('data-theme')); } catch(e) {}
  }
  try {
    const t = localStorage.getItem('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch(e) {}

  // Navigation
  function show(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('section-' + id).classList.add('active');
    document.getElementById('nav-' + id).classList.add('active');
  }

  // Format helpers
  const fmt = (n, d=2) => Number(n).toLocaleString('de-DE', {minimumFractionDigits:d, maximumFractionDigits:d});
  const fmtPct = n => (n >= 0 ? '+' : '') + fmt(n, 1) + '%';
  const colorPct = n => n > 0 ? 'pos' : n < 0 ? 'neg' : 'neu';

  function renderTiles(analyses, depot) {
    const buys = analyses.filter(a => a.rec === 'BUY').length;
    const sells = analyses.filter(a => a.rec === 'SELL').length;
    const depotVal = depot?.value ?? 0;
    const start = depot?.start ?? 10000;
    const pnl = depotVal - start;
    document.getElementById('tiles').innerHTML = `
      <div class="tile">
        <div class="tile-label">BUY Signale</div>
        <div class="tile-value pos">${buys}</div>
        <div class="tile-delta neu">${analyses.length} beobachtet</div>
      </div>
      <div class="tile">
        <div class="tile-label">SELL Signale</div>
        <div class="tile-value neg">${sells}</div>
        <div class="tile-delta neu">${analyses.length - buys - sells} HOLD</div>
      </div>
      <div class="tile">
        <div class="tile-label">Depotwert</div>
        <div class="tile-value">${fmt(depotVal)} €</div>
        <div class="tile-delta ${colorPct(pnl)}">${fmtPct((pnl/start)*100)} seit Start</div>
      </div>
    `;
  }

  function renderAnalyse(analyses) {
    const rows = analyses.map(a => `
      <tr>
        <td><strong style="font-family:var(--mono)">${a.ticker}</strong></td>
        <td>${fmt(a.price)}</td>
        <td class="${a.rsi < 35 ? 'pos' : a.rsi > 70 ? 'neg' : ''}">${fmt(a.rsi,0)}</td>
        <td class="${colorPct(a.drop20)}">${fmtPct(a.drop20)}</td>
        <td>${a.downtrend
          ? '<span class="trend-down">▼ Abwärts</span>'
          : '<span class="trend-up">▲ Aufwärts</span>'}</td>
        <td><span class="badge badge-${a.rec}">${a.rec}</span></td>
        <td style="color:var(--fg2);font-size:12px;min-width:0">${(a.why||[]).join(' · ')}</td>
      </tr>`).join('');
    document.getElementById('analyse-body').innerHTML = rows || '<tr><td colspan="7" class="empty">Keine Daten</td></tr>';
  }

  function renderAlarme(alerts) {
    if (!alerts.length) {
      document.getElementById('alerts-list').innerHTML = '<div class="empty">Keine aktiven Alarme</div>';
      return;
    }
    document.getElementById('alerts-list').innerHTML = alerts.map(a => `
      <div class="alert-card ${a.action}">
        <span class="alert-ticker">${a.ticker}</span>
        <span class="alert-msg">${a.msg}</span>
        <span class="alert-type" style="color:${a.action==='buy'?'var(--buy)':a.action==='sell'?'var(--sell)':'var(--fg3)'}">${a.type}</span>
      </div>`).join('');
  }

  function renderDepot(depot) {
    const pnl = (depot.value - depot.start);
    document.getElementById('depot-tiles').innerHTML = `
      <div class="tile">
        <div class="tile-label">Gesamtwert</div>
        <div class="tile-value">${fmt(depot.value)} €</div>
        <div class="tile-delta ${colorPct(pnl)}">${pnl >= 0 ? '+' : ''}${fmt(pnl)} € (${fmtPct((pnl/depot.start)*100)})</div>
      </div>
      <div class="tile">
        <div class="tile-label">Cash</div>
        <div class="tile-value">${fmt(depot.cash)} €</div>
        <div class="tile-delta neu">verfügbar</div>
      </div>
      <div class="tile">
        <div class="tile-label">Positionen</div>
        <div class="tile-value">${Object.keys(depot.positions||{}).length}</div>
        <div class="tile-delta neu">offen</div>
      </div>
    `;
    const pos = Object.entries(depot.positions || {});
    if (!pos.length) {
      document.getElementById('positions-list').innerHTML = '<div class="empty">Keine offenen Positionen</div>';
      return;
    }
    document.getElementById('positions-list').innerHTML = pos.map(([t, p]) => {
      return `
      <div class="pos-card">
        <div class="pos-ticker">${t}</div>
        <div class="pos-row"><span>Ø Kaufpreis</span><span>${fmt(p.avg_price)}</span></div>
        <div class="pos-row"><span>Stück</span><span>${fmt(p.shares, 4)}</span></div>
        <div class="pos-row"><span>Eröffnet</span><span>${p.opened || '–'}</span></div>
      </div>`;
    }).join('');
  }

  function renderNews(news) {
    const general = (news?.general || []).slice(0, 30);
    const ticker = Object.entries(news?.tickers || {}).flatMap(([t, items]) =>
      items.slice(0,3).map(n => ({...n, source: `[${t}] ${n.source}`}))
    );
    const all = [...general, ...ticker];
    if (!all.length) {
      document.getElementById('news-list').innerHTML = '<div class="empty">Keine News geladen</div>';
      return;
    }
    document.getElementById('news-list').innerHTML = all.map(n => `
      <div class="news-item">
        <span class="news-source">${(n.source||'').slice(0,20)}</span>
        <span class="news-title">${n.title}</span>
      </div>`).join('');
  }

  // Load data
  async function loadReport() {
    try {
      const res = await fetch('report.json');
      if (!res.ok) throw new Error('report.json nicht gefunden');
      const data = await res.json();

      document.getElementById('loading').style.display = 'none';
      show('analyse');

      const d = new Date(data.generated);
      document.getElementById('gen-time').textContent =
        `Stand: ${d.toLocaleDateString('de-DE')} ${d.toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'})}`;

      renderTiles(data.analyses || [], data.depot);
      renderAnalyse(data.analyses || []);
      renderAlarme(data.alerts || []);
      renderDepot(data.depot || {});
      renderNews(data.news || {});
    } catch(e) {
      document.getElementById('loading').textContent =
        'report.json nicht gefunden. Starte erst einen GitHub-Actions-Run.';
    }
  }

  loadReport();
</script>
